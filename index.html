<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OIIA Kitten Runner</title>
  <meta name="author" content="dyq0811" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <main>
    <h1 data-text="OIIA Kitten Runner" aria-label="OIIA Kitten Runner">OIIA Kitten Runner</h1>

    <div class="stage">
      <canvas id="game" width="800" height="250"></canvas>
    </div>

    <div class="controls">
      <div class="group">
        <span class="label">Speed</span>
        <button data-speed="0" class="speed">1 · Low</button>
        <button data-speed="1" class="speed">2 · Medium</button>
        <button data-speed="2" class="speed">3 · High</button>
      </div>

      <div class="group">
        <button id="spinCat" title="Click me!" aria-label="Spin the OIIA cat">
          <canvas class="disco" width="128" height="168"></canvas>
          <div class="spin-shadow"></div>
          <div class="spin-body"></div>
        </button>
        <button id="pauseBtn">Pause (P)</button>
      </div>

      <div class="group">
        <button id="micBtn">🎤 Mic: Off</button>
        <label class="label" for="sensitivity">Sensitivity</label>
        <div class="mic-tune">
          <div class="meter"><div id="micLevel"></div><div id="micThreshold"></div></div>
          <input id="sensitivity" type="range" min="1" max="100" value="80" />
        </div>
      </div>
    </div>

    <p class="help">
      <kbd>0</kbd> start &nbsp;·&nbsp;
      <kbd>Space</kbd> or shout <b>"oi!"</b> to jump &nbsp;·&nbsp;
      <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> change speed &nbsp;·&nbsp;
      <kbd>P</kbd>/<kbd>Esc</kbd> pause &nbsp;·&nbsp;
      <kbd>M</kbd> mic on/off
    </p>

    <p class="credit">© 2026 <a href="https://github.com/dyq0811" target="_blank" rel="noopener">dyq0811</a><br />OIIA cat image © W&amp;W</p>
  </main>

  <script src="game.js?v=2"></script>
</body>
</html>
